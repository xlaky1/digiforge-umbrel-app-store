repo: https://github.com/xlaky1/digiforge-umbrel-app-store
support: https://github.com/xlaky1/digiforge-umbrel-app-store/issues
port: 21036
gallery: []
path: ""
defaultPassword: ""
releaseNotes: >-
  DigiForge 1.0.1 fixes the web container startup failure caused by a nested
  read-only bind mount. The default Miningcore configuration is now read from
  /data/config.default.json through the existing writable app config mount.
  This release preserves the DigiForge 1.0 dashboard, pool, and node settings.
submitter: DigiForge
