version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: digiforge-dgb-pool_web_1
      APP_PORT: 8080

  init:
    image: digiforge-web:local-test
    restart: "no"
    entrypoint: ["python", "/app/init-secrets.py"]
    volumes:
      - ${APP_DATA_DIR}/secrets:/secrets

  web:
    image: digiforge-web:local-test
    restart: on-failure
    stop_grace_period: 10s
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/config:/data
      - ${APP_DATA_DIR}/secrets:/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - default
      - backend

  digibyted:
    image: digiforge-digibyte:local-test
    platform: linux/amd64
    restart: on-failure
    stop_grace_period: 60s
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/digibyte:/opt/blockchain/data
      - ${APP_DATA_DIR}/secrets:/secrets:ro
    ports:
      - "12024:12024/tcp"
    command:
      - /usr/bin/digibyted
      - -daemon=0
      - -datadir=/opt/blockchain/data
      - -printtoconsole=1
      - -server=1
      - -listen=1
      - -port=12024
      - -algo=sha256d
      - -prune=10000
      - -dbcache=1024
      - -maxconnections=64
      - -rpcbind=0.0.0.0
      - -rpcallowip=172.29.36.0/24
      - -rpcport=14022
    networks:
      backend:
        ipv4_address: 172.29.36.10

  postgres:
    image: digiforge-postgres:local-test
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: miningcore
      POSTGRES_DB: miningcore
      POSTGRES_PASSWORD_FILE: /secrets/postgres-password
    volumes:
      - ${APP_DATA_DIR}/postgres/data:/var/lib/postgresql/data
      - ${APP_DATA_DIR}/secrets:/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$(cat /secrets/postgres-password)\" psql -h 172.29.36.20 -U miningcore -d miningcore -Atqc 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      backend:
        ipv4_address: 172.29.36.20

  miningcore:
    image: digiforge-miningcore:local-test
    platform: linux/amd64
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/config:/config
    ports:
      - "3256:3256/tcp"
    networks:
      backend:
        ipv4_address: 172.29.36.30

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.36.0/24
